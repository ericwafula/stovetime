appId: com.ericwathome.stovetime.start
name: Raising the weekly goal shows straight away in the week row
tags:
  - me
---
- launchApp:
    clearState: true
- tapOn: "Me"
- extendedWaitUntil:
    visible: "This week: 0 of 4 cooks.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "me_goal_plus"
    direction: DOWN
- tapOn:
    id: "me_goal_plus"
- scrollUntilVisible:
    element: "This week: 0 of 5 cooks.*"
    direction: UP
- scrollUntilVisible:
    element:
      id: "me_goal_minus"
    direction: DOWN
- tapOn:
    id: "me_goal_minus"
- tapOn:
    id: "me_goal_minus"
- scrollUntilVisible:
    element: "This week: 0 of 3 cooks.*"
    direction: UP
