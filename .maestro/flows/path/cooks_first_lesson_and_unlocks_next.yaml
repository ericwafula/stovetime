appId: com.ericwathome.stovetime.start
name: A new cook finishes the first lesson, earns its XP and unlocks the next one
tags:
  - path
  - cook
  - finish
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: "Total XP: 0"
    timeout: 10000
- assertVisible: "Boiled eggs, up next"
- assertVisible: "Scrambled eggs, locked"
- tapOn:
    id: "path_start"
- extendedWaitUntil:
    visible:
      id: "intro_start"
    timeout: 10000
- assertVisible: "Boiled eggs"
- tapOn:
    id: "intro_start"
- extendedWaitUntil:
    visible:
      id: "cook_next"
    timeout: 10000
- assertVisible: "1/4"
- repeat:
    while:
      notVisible: "Dish done!"
    commands:
      - tapOn:
          id: "cook_next"
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible: "Dish done!"
- assertVisible: "XP earned: \\+20"
- tapOn: "Nailed it"
- tapOn:
    id: "finish_continue"
- extendedWaitUntil:
    visible: "Total XP: 20"
    timeout: 10000
- assertVisible: "Boiled eggs, cooked\\. Tap to cook it again"
- assertVisible: "Scrambled eggs, up next"
