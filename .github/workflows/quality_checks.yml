name: Run quality checks

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
      - 'workshop/**'
    paths-ignore:
      - '**/*.md'

concurrency:
  group: quality-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality_checks:
    name: Run Quality Checks
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the Gradle cache
        id: gradle-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: external

      - name: Add gradlew exec permissions
        run: chmod +x ./gradlew

      - name: Build, test and lint the debug app
        run: ./gradlew assembleDebug testDebugUnitTest checkHardcodedText ktlintCheck --continue

      - name: Stop Gradle so its cache can be saved
        if: always()
        run: ./gradlew --stop

      - name: Save the Gradle cache for pull requests
        if: github.event_name == 'push' && runner.environment == 'github-hosted'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  review:
    name: Review the changes
    needs: quality_checks
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Link the skills and agents
        run: if [ -x .ai/setup.sh ]; then .ai/setup.sh; fi

      - name: Review with the code-reviewer agent
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The changed files are the ones in `git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD`.
            Hand them to the code-reviewer agent and let it review them against CLAUDE.md, the skills in .ai/skills and the step's spec in .ai/roadmap if the PR names one.
            Post each finding it reports as an inline comment on its line, with why it matters and the fix. If it finds nothing, post one short comment saying the review found no issues.
            Don't change, commit or push anything.
          claude_args: '--max-turns 30 --allowedTools "Read,Grep,Glob,Task,Agent,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"'
